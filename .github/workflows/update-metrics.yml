name: Refresh public GitHub metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-metrics.yml'

permissions: {}

concurrency:
  group: profile-public-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test the metrics generator
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Fetch public data and render the cards
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/update_metrics.py

      - name: Commit only changed public metrics
        run: |
          git add -- assets/github-metrics.json assets/github-metrics-light.svg assets/github-metrics-dark.svg
          if git diff --cached --quiet; then
            echo 'Public metrics have not changed; nothing to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: refresh public GitHub metrics'
          git push
